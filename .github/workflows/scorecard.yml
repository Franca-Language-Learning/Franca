# OpenSSF Scorecard: a weekly score of the repository's security practices. The results are uploaded to code scanning
# and can be read in the repository's Security tab. They are not published to the OpenSSF public API, because nothing
# uses the published results and publishing needs the id-token permission, which only the release jobs have (story E01-013).
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      # The Scorecard action runs in a container, so only sudo is switched off.
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            codeload.github.com:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            www.bestpractices.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
