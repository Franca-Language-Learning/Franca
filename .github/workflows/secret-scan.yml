# Secret scan (story E01-013): gitleaks over the history of the checked-out commit, merge commits included, so a key
# or password that was committed and removed again is still found. With fetch-depth: 0, the history is fetched with both
# parents of each merge. The same command is run by  scripts/check secrets  on a computer.
# gitleaks is downloaded from its release page and checked against the SHA-256 in tools/programs.txt, which Renovate
# updates. Findings are printed with the secret redacted, and no report is uploaded. docs/secret-scanning.md says what
# to do with a finding.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history for secrets (scripts/check secrets)
        run: scripts/check secrets
