# Checks for every change (stories E01-003, E01-004 and E01-013). The content guard has its own workflow, and CodeQL
# code scanning is run through GitHub's default setup. The python and client parts of scripts/check are run in this
# workflow, so the same commands are run in the pipeline and in a local check.
# Actions are pinned to a full commit SHA, with the release tag in a comment; Renovate updates both.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server, contracts and tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no version given, setup-uv installs the version in required-version in pyproject.toml. It is pinned
      # there, because tools/startup-files-allowed.txt has the hash of the _virtualenv.py that this uv writes.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      # The locked packages and the start-up file check, ruff, mypy, import-linter, the tests, shellcheck and zizmor.
      - name: Python checks (scripts/check python)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check python
      # Pester and PSScriptAnalyzer are downloaded and checked against their SHA-256 in tools/programs.txt, then
      # loaded from those folders. The runner has other versions of both, which are not used.
      - name: Windows installer
        shell: pwsh
        run: |
          $pester = python3 -I tools/install_program.py Pester
          if ($LASTEXITCODE) { throw "Pester could not be installed" }
          $analyzer = python3 -I tools/install_program.py PSScriptAnalyzer
          if ($LASTEXITCODE) { throw "PSScriptAnalyzer could not be installed" }
          Remove-Module Pester, PSScriptAnalyzer -ErrorAction SilentlyContinue
          Import-Module (Join-Path $pester Pester.psd1) -Force
          Import-Module (Join-Path $analyzer PSScriptAnalyzer.psd1) -Force
          Get-Module Pester, PSScriptAnalyzer | Format-Table Name, Version, Path -AutoSize | Out-String -Width 200 | Write-Host
          $issues = Invoke-ScriptAnalyzer -Path installer/windows -Recurse -Settings installer/windows/PSScriptAnalyzerSettings.psd1
          $issues | Format-Table -AutoSize | Out-String | Write-Host
          if ($issues) { throw "PSScriptAnalyzer found $(@($issues).Count) issue(s) in the Windows installer" }
          Invoke-Pester -Path installer/windows/tests -CI

  client:
    name: Client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-pnpm
      # The locked packages, the API types against the contract, the type check, the module boundaries, the tests and
      # the build.
      - name: Client checks (scripts/check client)
        run: scripts/check client

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Chromium comes from Playwright's image, named by digest, so the browser is pinned like the other images.
      # Renovate updates the image together with @playwright/test, because the two versions have to match.
      PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579"  # renovate: image
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - uses: $/.github/actions/setup-pnpm
      # The server runs from this environment, so the environment is checked for start-up files before Python is started.
      - name: Install the locked packages
        run: |
          uv sync --locked
          tools/check-startup-files.sh .venv
          pnpm install --frozen-lockfile
      # Chromium is run in Playwright's container and is reached on port 3000. The container is on the runner's
      # network, so the test servers can be reached on localhost from the browser. The checkout is mounted read-only
      # at the same path, and the locked Playwright in node_modules is used.
      - name: Start Chromium in Playwright's container
        run: |
          docker run --detach --name playwright --init --network host --user pwuser \
            --shm-size=1g --cap-drop ALL --security-opt no-new-privileges \
            --volume "$PWD:$PWD:ro" --workdir "$PWD/client" "$PLAYWRIGHT_IMAGE" \
            node_modules/.bin/playwright run-server --port 3000 --host 127.0.0.1
          for _ in $(seq 60); do
            if curl --silent --output /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 1
          done
          docker logs playwright
          exit 1
      - name: Browser tests
        env:
          CI: "true"
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
        run: pnpm --filter @franca/client e2e
      - name: Show the log of Playwright's container
        if: failure()
        run: docker logs playwright
      - name: Keep the test report for 7 days
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  container-bundle:
    name: Container bundle
    runs-on: ubuntu-24.04
    # The job takes 22 to 25 minutes, of which the image builds take 6 to 10, depending on the runner.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same check is run with the server's tests. In this job the registries can be reached, so the digest of an
      # image that has none is printed in the log.
      - name: Check that images and sources are pinned
        run: python3 -I tools/check_pins.py --resolve
      - name: Build, start and check the bundle
        run: infra/tests/test-bundle.sh
      # The rehearsal runs the updater's code on the runner, with the same Python as the updater's image.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Rehearse an update and a rollback
        run: uv run --no-project --python 3.14 python infra/tests/rehearse_update.py
      - name: Rehearse a backup, a restore test and a restore
        run: uv run --no-project --python 3.14 python infra/tests/rehearse_backup.py
      - name: Rehearse the private network
        run: uv run --no-project --python 3.14 python infra/tests/rehearse_tailnet.py
      - name: Rehearse health monitoring
        run: uv run --no-project --python 3.14 python infra/tests/rehearse_status.py
      - name: Rehearse the installer
        run: uv run --no-project --python 3.14 python infra/tests/rehearse_install.py
      # Cosign is downloaded by the installer and kept only when its hash matches, so the download is tried here.
      - name: Check the installer's cosign download against its hash
        run: >-
          uv run --no-project --python 3.14 python -I -c "import pathlib, sys, tempfile; sys.path[:0] = ['installer/linux', 'infra/updater'];
          import franca_install; franca_install.install_cosign(pathlib.Path(tempfile.mkdtemp()) / 'cosign')"
      # The same scan as in the release workflow, so a vulnerable image is found before a release. Grype is downloaded
      # and checked against its SHA-256 in tools/programs.txt, and reads .grype.yaml from the repository root. Each image
      # is scanned, and the step fails at the end if any of them has a finding of high or critical severity that has a fix.
      - name: Scan the images for known vulnerabilities
        run: |
          grype="$(python3 -I tools/install_program.py grype)"
          "$grype" version
          status=0
          for image in app caddy updater backup tailscale status; do
            echo "== franca/$image:0.1.0-dev"
            "$grype" "docker:franca/$image:0.1.0-dev" --fail-on high --only-fixed --output table || status=1
          done
          exit "$status"

  api-contract:
    name: API contract changes
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get the contract as it is on the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: git show "$BASE:contracts/openapi.yaml" > base-openapi.yaml
      # A breaking change to the API fails the build (story E01-002). A deliberate break needs a new API version.
      - uses: oasdiff/oasdiff-action/breaking@14ca7009a63c417dfe27b7c44359c4bcccaf8eee # v0.2.1
        with:
          base: base-openapi.yaml
          revision: contracts/openapi.yaml
          fail-on: ERR
          review: "false"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # Licences that would stop the app's code being published under a licence of the owner's choice later.
          # The speech container is GPL-3.0-or-later and has its own dependencies (speech/LICENSE).
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
