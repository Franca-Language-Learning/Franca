# Checks for every change (stories E01-003, E01-004 and E01-013). The content guard has its own workflow.
# Actions are pinned to a full commit SHA, with the release tag in a comment; Renovate updates both.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server, contracts and tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Pinned, because tools/startup-files-allowed.txt has the hash of the _virtualenv.py that this uv writes.
          version: "0.11.32" # renovate: datasource=github-releases depName=astral-sh/uv
          enable-cache: false
      - name: Install the locked Python packages
        run: uv sync --locked
      - name: Check for start-up files in the environment
        run: tools/check-startup-files.sh .venv
      - name: Lint and format
        working-directory: server
        run: |
          uv run ruff check . ../contracts ../tools ../infra/updater ../infra/backup ../infra/tests
          uv run ruff format --check . ../contracts ../tools ../infra/updater ../infra/backup ../infra/tests
      - name: Type check
        working-directory: server
        run: |
          uv run mypy
          uv run mypy --strict ../tools/content_guard.py ../infra/updater/franca_updater.py ../infra/backup/franca_backup.py ../infra/tests/rehearse_update.py ../infra/tests/rehearse_backup.py ../infra/tests/rehearse_tailnet.py ../infra/tests/rehearse_status.py
      - name: Module boundaries
        working-directory: server
        env:
          PYTHONPATH: src
        run: uv run lint-imports
      - name: Tests
        working-directory: server
        env:
          CI: "true"
        run: uv run pytest
      - name: Shell scripts
        working-directory: server
        run: uv run shellcheck ../tools/*.sh ../.githooks/* ../scripts/* ../client/scripts/*.sh ../infra/tests/*.sh
      - name: Workflow security
        working-directory: server
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor ../.github/workflows

  client:
    name: Client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the locked packages
        run: pnpm install --frozen-lockfile
      - name: API types match the contract
        run: |
          pnpm --filter @franca/client generate:api
          git diff --exit-code -- client/src/api/schema.d.ts
      - name: Type check
        run: pnpm --filter @franca/client typecheck
      - name: Module boundaries
        run: pnpm --filter @franca/client boundaries
      - name: Tests
        run: pnpm --filter @franca/client test
      - name: Build
        run: pnpm --filter @franca/client build

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32" # renovate: datasource=github-releases depName=astral-sh/uv
          enable-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the locked packages
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile
      - name: Install Playwright's Chromium
        run: pnpm --filter @franca/client exec playwright install --with-deps chromium
      - name: Browser tests
        env:
          CI: "true"
        run: pnpm --filter @franca/client e2e
      - name: Keep the test report for 7 days
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  container-bundle:
    name: Container bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, start and check the bundle
        run: infra/tests/test-bundle.sh
      # The rehearsal runs the updater's code on the runner, with the same Python as the updater's image.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32" # renovate: datasource=github-releases depName=astral-sh/uv
          enable-cache: false
      - name: Rehearse an update and a rollback
        run: uv run --no-project --python 3.14 python infra/tests/rehearse_update.py
      - name: Rehearse a backup, a restore test and a restore
        run: uv run --no-project --python 3.14 python infra/tests/rehearse_backup.py
      - name: Rehearse the private network
        run: uv run --no-project --python 3.14 python infra/tests/rehearse_tailnet.py
      - name: Rehearse health monitoring
        run: uv run --no-project --python 3.14 python infra/tests/rehearse_status.py
      # The same scan as in the release workflow, so a vulnerable image is found before a release.
      - name: Scan the app image for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: franca/app:0.1.0-dev
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Scan the caddy image for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: franca/caddy:0.1.0-dev
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Scan the updater image for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: franca/updater:0.1.0-dev
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Scan the backup image for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: franca/backup:0.1.0-dev
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Scan the tailscale image for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: franca/tailscale:0.1.0-dev
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Scan the status image for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: franca/status:0.1.0-dev
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  api-contract:
    name: API contract changes
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get the contract as it is on the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: git show "$BASE:contracts/openapi.yaml" > base-openapi.yaml
      # A breaking change to the API fails the build (story E01-002). A deliberate break needs a new API version.
      - uses: oasdiff/oasdiff-action/breaking@14ca7009a63c417dfe27b7c44359c4bcccaf8eee # v0.2.1
        with:
          base: base-openapi.yaml
          revision: contracts/openapi.yaml
          fail-on: ERR
          review: "false"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # Licences that would stop the app's code being published under a licence of the owner's choice later.
          # The speech container is GPL-3.0-or-later and has its own dependencies (speech/LICENSE).
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
