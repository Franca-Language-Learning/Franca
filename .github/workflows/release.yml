# Release (story E01-006): builds the images from a version tag, pushes them to the GitHub container registry,
# scans them, signs them with cosign and attaches an SBOM and build provenance. The updater installs only images
# signed by this workflow for a version tag (story E01-007). docs/verifying-releases.md has the commands to check.
#
# A release is made by pushing a tag such as v0.1.0. The jobs run in the "release" environment, which accepts tags
# starting with v only; the id-token permission (for keyless signing) is given in this workflow only.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    strategy:
      fail-fast: true
      matrix:
        image: [app, caddy, updater, backup, tailscale, status]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/franca-language-learning/franca-${{ matrix.image }}
      # The BuildKit image in which the signed images are built, named by digest. Buildx itself is the version installed on
      # the runner.
      BUILDKIT_IMAGE: "moby/buildkit:buildx-stable-1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c"  # renovate: image
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/${{ matrix.image }}.Dockerfile
          build-args: FRANCA_VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
          # Provenance and the SBOM are attached below as signed attestations.
          provenance: false
          sbom: false
      - name: Scan for known vulnerabilities (the image is not signed if this fails)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: "v0.122.1" # renovate: datasource=github-releases depName=anchore/grype
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - name: Make the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: "v1.57.2" # renovate: datasource=github-releases depName=anchore/syft
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-artifact-retention: 7
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attach the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attach the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" > "digest-${{ matrix.image }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digest-${{ matrix.image }}.txt
          retention-days: 7

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      # For the build provenance of the installer package.
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      # The installer for Windows (story E01-011): the Windows script, the Linux part, the updater it uses to read and
      # check the release, and the bundle's compose.yaml, from this version's tag.
      - name: Make the installer package
        run: |
          mkdir -p franca-installer
          cp installer/windows/Install-Franca.ps1 installer/windows/Install-Franca.cmd installer/linux/franca_install.py \
            infra/updater/franca_updater.py infra/compose.yaml docs/installing-franca.md franca-installer/
          (cd franca-installer && zip -q -r "../assets/franca-installer.zip" .)
          sha256sum assets/franca-installer.zip > assets/franca-installer.zip.sha256
      - name: Attach the build provenance of the installer package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/franca-installer.zip
      - name: Publish the release with the image digests and SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          {
            echo "Images (signed with cosign; see docs/verifying-releases.md):"
            echo
            sed 's/^/    /' assets/digest-*.txt
          } > notes.md
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file notes.md assets/*
