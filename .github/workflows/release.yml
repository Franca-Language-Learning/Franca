# Release (story E01-006). A maintainer makes a release by pushing a version tag such as v0.1.0.
#
# 1. build: each image is built and pushed to the GitHub container registry by digest, with no version tag yet.
#    It is scanned with Grype and an SBOM is made with Syft. This job has no id-token permission.
# 2. sign: in the "release" environment, each image is signed with keyless cosign, build provenance and the SBOM
#    are attached as signed attestations, and only then is the version tag added to the image.
# 3. release: a GitHub release is published with the image digests and the SBOMs.
#
# The "release" environment is limited to version tags in the repository settings. This is the only workflow with
# the id-token permission, which is needed for keyless signing. The updater installs only images signed by this
# workflow for a version tag (story E01-007). docs/verifying-releases.md has the commands for checking a release.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [app, caddy]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/franca-language-learning/franca-${{ matrix.image }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version number without the v
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/${{ matrix.image }}.Dockerfile
          build-args: FRANCA_VERSION=${{ steps.version.outputs.number }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Provenance and the SBOM are attached as signed attestations in the sign job.
          provenance: false
          sbom: false
      - name: Scan for known vulnerabilities (the image is not signed or tagged if this fails)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - name: Make the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" > "digest-${{ matrix.image }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: |
            digest-${{ matrix.image }}.txt
            sbom-${{ matrix.image }}.spdx.json
          retention-days: 7

  sign:
    name: Sign ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    strategy:
      fail-fast: false
      matrix:
        image: [app, caddy]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/franca-language-learning/franca-${{ matrix.image }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.image }}
      - name: Read the digest
        id: digest
        run: echo "digest=$(cut -d@ -f2 "digest-${{ matrix.image }}.txt")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attach the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Attach the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true
      - name: Add the version tag to the signed image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"

  release:
    name: GitHub release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: assets
          merge-multiple: true
      - name: Publish the release with the image digests and SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          {
            echo "Images, signed with cosign (see docs/verifying-releases.md):"
            echo
            sed 's/^/    /' assets/digest-*.txt
          } > notes.md
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file notes.md assets/*
