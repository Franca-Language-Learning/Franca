info:
  title: Franca API
  version: '1'
openapi: 3.1.0
paths:
  /api/v1/auth/google/callback:
    get:
      operationId: finishGoogleSignIn
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '303':
          description: To the home page, or to the sign-in page with the reason it
            failed
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Where Google sends the browser back after sign-in
      tags:
      - identity
  /api/v1/auth/google/start:
    get:
      operationId: startGoogleSignIn
      responses:
        '302':
          description: To Google's sign-in page
        '503':
          description: Sign-in with Google is not configured
      summary: Sends the browser to Google to sign in
      tags:
      - identity
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Ends the sign-in session on this device
      tags:
      - identity
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Successful Response
      summary: Whether the service is running
      tags:
      - platform
  /api/v1/invitations:
    get:
      operationId: listInvitations
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
          description: Successful Response
        '401':
          description: Not signed in
        '403':
          description: Only the owner can see invitations
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: The invitations, newest first (owner only)
      tags:
      - identity
    post:
      operationId: createInvitation
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationOut'
          description: Successful Response
        '401':
          description: Not signed in
        '403':
          description: Only the owner can invite learners
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Invites a learner by e-mail address (owner only)
      tags:
      - identity
  /api/v1/me:
    get:
      operationId: getMe
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: Successful Response
        '401':
          description: Not signed in
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: The signed-in learner
      tags:
      - identity
