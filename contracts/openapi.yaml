info:
  title: Franca API
  version: '1'
openapi: 3.1.0
paths:
  /api/v1/auth/google/callback:
    get:
      operationId: finishGoogleSignIn
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '303':
          description: To the home page, or to the sign-in page with the reason it
            failed
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Where Google sends the browser back after sign-in
      tags:
      - identity
  /api/v1/auth/google/start:
    get:
      operationId: startGoogleSignIn
      responses:
        '302':
          description: To Google's sign-in page
        '503':
          description: Sign-in with Google is not configured
      summary: Sends the browser to Google to sign in
      tags:
      - identity
  /api/v1/auth/passkey:
    post:
      operationId: signInWithPasskey
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: Successful Response
        '400':
          description: No options were asked for
        '401':
          description: Franca does not have the passkey (passkey-unknown), the answer
            failed a check, or the account is disabled
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Signs in with the device's answer to the options
      tags:
      - identity
  /api/v1/auth/passkey/options:
    post:
      operationId: getPasskeySignInOptions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyOptions'
          description: Successful Response
      summary: Options for signing in with a passkey
      tags:
      - identity
  /api/v1/auth/recovery-code:
    post:
      operationId: signInWithRecoveryCode
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverySignIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: Successful Response
        '401':
          description: The address or the code is wrong, the code was used already,
            or the account is disabled
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '429':
          description: Five wrong codes in 15 minutes; try again later
      summary: Signs in with an e-mail address and a recovery code
      tags:
      - identity
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Ends the sign-in session on this device
      tags:
      - identity
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Successful Response
      summary: Whether the service is running
      tags:
      - platform
  /api/v1/invitations:
    get:
      operationId: listInvitations
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
          description: Successful Response
        '401':
          description: Not signed in
        '403':
          description: Only the owner can see invitations
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: The invitations, newest first (owner only)
      tags:
      - identity
    post:
      operationId: createInvitation
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationOut'
          description: Successful Response
        '401':
          description: Not signed in
        '403':
          description: Only the owner can invite learners
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Invites a learner by e-mail address (owner only)
      tags:
      - identity
  /api/v1/me:
    get:
      operationId: getMe
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: Successful Response
        '401':
          description: Not signed in
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: The signed-in learner
      tags:
      - identity
  /api/v1/passkeys:
    get:
      operationId: listPasskeys
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyList'
          description: Successful Response
        '401':
          description: Not signed in
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: The signed-in learner's passkeys
      tags:
      - identity
    post:
      operationId: addPasskey
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOut'
          description: Successful Response
        '400':
          description: No options were asked for, or the answer failed a check
        '401':
          description: Not signed in
        '403':
          description: The learner signed in more than 15 minutes ago (sign-in-again)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Adds a passkey with the device's answer to the options
      tags:
      - identity
  /api/v1/passkeys/options:
    post:
      operationId: getPasskeyRegistrationOptions
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyOptions'
          description: Successful Response
        '401':
          description: Not signed in
        '403':
          description: The learner signed in more than 15 minutes ago (sign-in-again),
            or has the most passkeys allowed
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Options for adding a passkey on this device
      tags:
      - identity
  /api/v1/passkeys/{passkeyId}:
    delete:
      operationId: removePasskey
      parameters:
      - in: path
        name: passkeyId
        required: true
        schema:
          title: Passkeyid
          type: string
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not signed in
        '404':
          description: The learner has no passkey with this id
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Removes one of the signed-in learner's passkeys
      tags:
      - identity
  /api/v1/recovery-codes:
    get:
      operationId: getRecoveryCodeStatus
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodeStatusOut'
          description: Successful Response
        '401':
          description: Not signed in
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: How many of the signed-in learner's recovery codes are left
      tags:
      - identity
    post:
      operationId: makeRecoveryCodes
      parameters:
      - in: cookie
        name: franca_session
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Franca Session
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: Successful Response
        '401':
          description: Not signed in
        '403':
          description: The learner signed in more than 15 minutes ago (sign-in-again)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Makes ten new recovery codes; the old ones stop working
      tags:
      - identity
