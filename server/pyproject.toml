[project]
name = "franca-server"
version = "0.1.0"
description = "Franca's application service: the API, the learning engine and the module boundaries between them."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyyaml>=6",
    "jsonschema>=4.23",
    "uvicorn>=0.32",
    "sqlalchemy>=2.1.9",
    "alembic>=1.20.1",
    "authlib>=1.9.9",
    "itsdangerous>=2.2.0",
    "joserfc>=1.8.0",
    "httpx2>=2.16.2",
    "webauthn>=3.0.1",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6",
    "types-jsonschema>=4.23",
    "import-linter>=2.1",
    "shellcheck-py>=0.10",
    "zizmor>=1.0",
    "pytest-alembic>=0.13.2",
]

[tool.uv]
# The server is not built into a package. uv installs wheels only (see the root pyproject.toml), so the source
# is used in place: pytest and mypy look in src/, and the container image copies src/ and sets PYTHONPATH.
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "../contracts/db/tests", "../contracts/pack/tests", "../tools/tests", "../infra/updater/tests", "../infra/backup/tests", "../infra/tests", "../installer/linux/tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py314"
src = ["src", "tests"]
# The installer runs with the python3 of Debian 13 (3.13) in the Franca WSL system, and imports the updater's code.
# The content guard runs in Git hooks with the python3 of the computer, so it is kept to Python 3.13 syntax as well.
per-file-target-version = { "../installer/linux/*.py" = "py313", "../infra/updater/franca_updater.py" = "py313", "../tools/content_guard.py" = "py313" }

[tool.ruff.lint]
# E/F/W: errors and pyflakes; I: import order; B: bugbear; S: security (bandit rules); UP: modern syntax.
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"../contracts/**" = ["S101", "S603", "S608"]
"../tools/**" = ["S101", "S603", "S607"]
# The updater runs docker and cosign by name, with arguments it builds itself.
"../infra/updater/**" = ["S603", "S607"]
"../infra/updater/tests/**" = ["S101", "S102", "S603", "S607"]
# The backup runs restic by name, with arguments it builds itself.
"../infra/backup/**" = ["S603", "S607"]
"../infra/backup/tests/**" = ["S101", "S603", "S607"]
"../infra/tests/**" = ["S603", "S607", "S608"]
"../infra/tests/test_*.py" = ["S101"]
# The installer runs apt, docker and curl by name, with arguments it builds itself.
"../installer/linux/**" = ["S603", "S607"]
"../installer/linux/tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["franca"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Authlib has no type information.
module = ["authlib.*"]
ignore_missing_imports = true

# Module boundaries (story E01-003). The HTTP layer sits above the twelve modules, and the modules sit above
# franca.platform (settings, database access, logging). Modules may import each other's package root only;
# tests/test_module_boundaries.py checks that, using the same import graph (grimp) as import-linter.
[tool.importlinter]
root_package = "franca"

[[tool.importlinter.contracts]]
name = "Layers: api, then modules, then platform"
type = "layers"
layers = [
    "franca.api",
    "franca.identity : franca.catalogue : franca.study : franca.memory : franca.checking : franca.mastery : franca.speech_client : franca.partner : franca.ai : franca.library : franca.studio : franca.records",
    "franca.platform",
]
