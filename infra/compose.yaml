# Franca's container bundle (story E01-005). Start it from the repository root with:
#   docker compose -f infra/compose.yaml up -d --build --wait
# The other containers (worker, speech, languagetool) are added in their own stories.
#
# The installer writes the .env file beside this file. A release names its images by digest there
# (FRANCA_APP_IMAGE, FRANCA_CADDY_IMAGE, FRANCA_UPDATER_IMAGE), and the updater changes them (story E01-007).
# The updater and its socket proxy are in the "updates" profile, the backup is in the "backups" profile, the private
# network is in the "tailnet" profile and health monitoring is in the "monitoring" profile. The installer switches
# them on with COMPOSE_PROFILES=updates,backups,tailnet,monitoring.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  tmpfs:
    - /tmp

services:
  app:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/images/app.Dockerfile
      args:
        FRANCA_VERSION: ${FRANCA_VERSION:-0.1.0-dev}
    image: ${FRANCA_APP_IMAGE:-franca/app:${FRANCA_VERSION:-0.1.0-dev}}
    # A small init process passes stop signals on, also while the migration runs before the service starts.
    init: true
    environment:
      FRANCA_PUBLIC_URL: ${FRANCA_PUBLIC_URL:-http://localhost:8080}
      FRANCA_OWNER_EMAIL: ${FRANCA_OWNER_EMAIL:-}
      FRANCA_GOOGLE_CLIENT_ID: ${FRANCA_GOOGLE_CLIENT_ID:-}
      FRANCA_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      FRANCA_SESSION_SECRET_FILE: /run/secrets/session_secret
    secrets: [google_client_secret, session_secret]
    volumes:
      - app-data:/data
    networks: [internal]

  caddy:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/images/caddy.Dockerfile
    image: ${FRANCA_CADDY_IMAGE:-franca/caddy:${FRANCA_VERSION:-0.1.0-dev}}
    depends_on:
      app:
        condition: service_healthy
    environment:
      # The PC's name on the tailnet, such as franca.tail1234.ts.net. The installer writes it to .env. Until then a
      # placeholder name is used, so that Caddy can start.
      FRANCA_TAILSCALE_NAME: ${FRANCA_TAILSCALE_NAME:-tailscale-name-not-set.ts.net}
    ports:
      # Loopback only, for checks on the PC itself. Phones and laptops reach Franca over the tailnet, through the
      # tailscale container, on port 443.
      - "127.0.0.1:${FRANCA_PORT:-8080}:8080"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Caddy asks tailscaled for the certificate of the Tailscale name through this socket.
      - tailscale-socket:/var/run/tailscale:ro
    networks:
      internal:
        # Inside the bundle, the Tailscale name is an alias for Caddy, so Caddy's certificate can be checked.
        aliases: ["${FRANCA_TAILSCALE_NAME:-tailscale-name-not-set.ts.net}"]

  # The private network (story E01-009). The PC joins the owner's tailnet as a device named franca, and connections
  # to port 443 on that name are passed to Caddy on port 8443, still encrypted. Caddy serves HTTPS there with the
  # certificate for the Tailscale name, which tailscaled gets from Let's Encrypt. No port is opened on the PC.
  tailscale:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/images/tailscale.Dockerfile
    image: ${FRANCA_TAILSCALE_IMAGE:-franca/tailscale:${FRANCA_VERSION:-0.1.0-dev}}
    profiles: [tailnet]
    environment:
      TS_AUTHKEY: file:/run/secrets/tailscale_authkey
      # The key is used to join once. At later starts the saved state is used, so a used or expired key does not matter.
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${FRANCA_TAILSCALE_HOSTNAME:-franca}
      TS_STATE_DIR: /var/lib/tailscale
      # The socket itself has to be in the shared volume. Without this, containerboot puts it in /tmp and leaves only a
      # symlink in the volume, which Caddy cannot follow.
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "true"
      # Caddy's user may fetch the certificate. Any user of the socket can read the status and open connections to
      # other devices in the tailnet. The tailnet policy in docs/private-network.md has no rule for connections from
      # franca.
      TS_PERMIT_CERT_UID: "10002"
    secrets: [tailscale_authkey]
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
    networks: [internal]

  # Docker's API, limited to the calls the updater needs: containers, images, networks and volumes, with starting
  # and stopping. Exec, build, swarm, plugins, secrets and system calls are refused. The proxy is on its own
  # network, which only the updater joins.
  socket-proxy:
    <<: *hardening
    image: lscr.io/linuxserver/socket-proxy:3.4.8-r0-ls107@sha256:6beb1743581ec3b2ed1a2bafd617e8c7a1d7ae2fe835293e333327618fc2b925
    profiles: [updates]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
      - /tmp
    networks: [docker-api]

  updater:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/images/updater.Dockerfile
      args:
        FRANCA_VERSION: ${FRANCA_VERSION:-0.1.0-dev}
    image: ${FRANCA_UPDATER_IMAGE:-franca/updater:${FRANCA_VERSION:-0.1.0-dev}}
    profiles: [updates]
    depends_on: [socket-proxy]
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # The bundle folder is mounted at the same path as on the PC, so that the paths in this file (secrets, the
      # .env file) mean the same inside the updater as they do to Docker.
      FRANCA_BUNDLE_DIR: ${FRANCA_BUNDLE_DIR:-/franca-bundle-not-set}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-franca}
      FRANCA_HEALTH_URL: http://app:8000/api/v1/health
      FRANCA_UPDATE_AT_UTC: ${FRANCA_UPDATE_AT_UTC:-02:30}
      # Each run's result is reported to the status container (story E01-010), with the token in status_push_token.
      FRANCA_STATUS_URL: http://status:8080
    secrets: [status_push_token]
    volumes:
      - ${FRANCA_BUNDLE_DIR:-/franca-bundle-not-set}:${FRANCA_BUNDLE_DIR:-/franca-bundle-not-set}
      - updater-status:/status
    networks: [internal, docker-api]

  # The nightly backup and the monthly restore test (story E01-008). The backups go to FRANCA_BACKUP_DIR, a folder
  # on a second disk in the PC (disk J:) until an off-site store is chosen.
  backup:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/images/backup.Dockerfile
      args:
        FRANCA_VERSION: ${FRANCA_VERSION:-0.1.0-dev}
    image: ${FRANCA_BACKUP_IMAGE:-franca/backup:${FRANCA_VERSION:-0.1.0-dev}}
    profiles: [backups]
    # A small init process passes stop signals on, so a stop does not cut restic off mid-way.
    init: true
    stop_grace_period: 2m
    environment:
      FRANCA_BACKUP_AT_UTC: ${FRANCA_BACKUP_AT_UTC:-03:30}
      FRANCA_HEALTH_URL: http://app:8000/api/v1/health
      # Each run's result is reported to the status container (story E01-010), with the token in status_push_token.
      FRANCA_STATUS_URL: http://status:8080
    secrets: [backup_password, status_push_token]
    volumes:
      - app-data:/data
      - backup-cache:/cache
      - backup-status:/status
      - ${FRANCA_BACKUP_DIR:-/franca-backups-not-set}:/backups
    networks: [internal]

  # Health monitoring (story E01-010). Gatus checks the app and the web server every minute, and HTTPS and
  # Tailscale once the PC has a Tailscale name. The updater and the backup report each run. Alerts go to the owner's
  # phone through ntfy. The dashboard is on the PC's loopback only.
  status:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/images/status.Dockerfile
    image: ${FRANCA_STATUS_IMAGE:-franca/status:${FRANCA_VERSION:-0.1.0-dev}}
    profiles: [monitoring]
    environment:
      FRANCA_TAILSCALE_NAME: ${FRANCA_TAILSCALE_NAME:-tailscale-name-not-set.ts.net}
      FRANCA_NTFY_URL: ${FRANCA_NTFY_URL:-https://ntfy.sh}
      # The checks of HTTPS and Tailscale are made only when the tailnet profile is on.
      FRANCA_PROFILES: ${COMPOSE_PROFILES:-}
    secrets: [ntfy_topic, status_push_token]
    ports:
      - "127.0.0.1:${FRANCA_STATUS_PORT:-8081}:8080"
    volumes:
      - status-data:/data
    networks: [internal]

# Secrets are files in the secrets folder on the PC (FRANCA_SECRETS_DIR). The installer writes them (story E01-011).
secrets:
  google_client_secret:
    file: ${FRANCA_SECRETS_DIR:-./secrets}/google_client_secret
  session_secret:
    file: ${FRANCA_SECRETS_DIR:-./secrets}/session_secret
  # The backups' encryption password. Without it the backups cannot be read, so the owner keeps a copy elsewhere.
  backup_password:
    file: ${FRANCA_SECRETS_DIR:-./secrets}/backup_password
  # A Tailscale auth key, used once when the PC joins the tailnet.
  tailscale_authkey:
    file: ${FRANCA_SECRETS_DIR:-./secrets}/tailscale_authkey
  # The ntfy topic that alerts are sent to. Anyone who knows it can read the alerts, so it is long and random.
  ntfy_topic:
    file: ${FRANCA_SECRETS_DIR:-./secrets}/ntfy_topic
  # The token with which the updater and the backup report to the status container.
  status_push_token:
    file: ${FRANCA_SECRETS_DIR:-./secrets}/status_push_token

volumes:
  updater-status:
  backup-cache:
  backup-status:
  app-data:
  caddy-data:
  caddy-config:
  tailscale-state:
  tailscale-socket:
  status-data:

networks:
  internal:
  docker-api:
    internal: true
