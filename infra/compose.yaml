# Franca's container bundle (story E01-005). Start it from the repository root with:
#   docker compose -f infra/compose.yaml up -d --build --wait
# The other containers (worker, speech, languagetool, backup, status, tailscale) are added in their own stories.
#
# The installer writes the .env file beside this file. A release names its images by digest there
# (FRANCA_APP_IMAGE, FRANCA_CADDY_IMAGE, FRANCA_UPDATER_IMAGE), and the updater changes them (story E01-007).
# The updater and its socket proxy are in the "updates" profile, and the backup is in the "backups" profile. The
# installer switches them on with COMPOSE_PROFILES=updates,backups.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  tmpfs:
    - /tmp

services:
  app:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/images/app.Dockerfile
      args:
        FRANCA_VERSION: ${FRANCA_VERSION:-0.1.0-dev}
    image: ${FRANCA_APP_IMAGE:-franca/app:${FRANCA_VERSION:-0.1.0-dev}}
    # A small init process passes stop signals on, also while the migration runs before the service starts.
    init: true
    environment:
      FRANCA_PUBLIC_URL: ${FRANCA_PUBLIC_URL:-http://localhost:8080}
      FRANCA_OWNER_EMAIL: ${FRANCA_OWNER_EMAIL:-}
      FRANCA_GOOGLE_CLIENT_ID: ${FRANCA_GOOGLE_CLIENT_ID:-}
      FRANCA_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      FRANCA_SESSION_SECRET_FILE: /run/secrets/session_secret
    secrets: [google_client_secret, session_secret]
    volumes:
      - app-data:/data
    networks: [internal]

  caddy:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/images/caddy.Dockerfile
    image: ${FRANCA_CADDY_IMAGE:-franca/caddy:${FRANCA_VERSION:-0.1.0-dev}}
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Loopback only: the bundle is not reachable from the network until Tailscale is added (story E01-009).
      - "127.0.0.1:${FRANCA_PORT:-8080}:8080"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  # Docker's API, limited to the calls the updater needs: containers, images, networks and volumes, with starting
  # and stopping. Exec, build, swarm, plugins, secrets and system calls are refused. The proxy is on its own
  # network, which only the updater joins.
  socket-proxy:
    <<: *hardening
    image: lscr.io/linuxserver/socket-proxy:3.4.8-r0-ls107
    profiles: [updates]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
      - /tmp
    networks: [docker-api]

  updater:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/images/updater.Dockerfile
      args:
        FRANCA_VERSION: ${FRANCA_VERSION:-0.1.0-dev}
    image: ${FRANCA_UPDATER_IMAGE:-franca/updater:${FRANCA_VERSION:-0.1.0-dev}}
    profiles: [updates]
    depends_on: [socket-proxy]
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # The bundle folder is mounted at the same path as on the PC, so that the paths in this file (secrets, the
      # .env file) mean the same inside the updater as they do to Docker.
      FRANCA_BUNDLE_DIR: ${FRANCA_BUNDLE_DIR:-/franca-bundle-not-set}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-franca}
      FRANCA_HEALTH_URL: http://app:8000/api/v1/health
      FRANCA_UPDATE_AT_UTC: ${FRANCA_UPDATE_AT_UTC:-02:30}
    volumes:
      - ${FRANCA_BUNDLE_DIR:-/franca-bundle-not-set}:${FRANCA_BUNDLE_DIR:-/franca-bundle-not-set}
      - updater-status:/status
    networks: [internal, docker-api]

  # The nightly backup and the monthly restore test (story E01-008). The backups go to FRANCA_BACKUP_DIR, a folder
  # on a second disk in the PC (disk J:) until an off-site store is chosen.
  backup:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/images/backup.Dockerfile
      args:
        FRANCA_VERSION: ${FRANCA_VERSION:-0.1.0-dev}
    image: ${FRANCA_BACKUP_IMAGE:-franca/backup:${FRANCA_VERSION:-0.1.0-dev}}
    profiles: [backups]
    environment:
      FRANCA_BACKUP_AT_UTC: ${FRANCA_BACKUP_AT_UTC:-03:30}
      FRANCA_HEALTH_URL: http://app:8000/api/v1/health
    secrets: [backup_password]
    volumes:
      - app-data:/data
      - backup-cache:/cache
      - backup-status:/status
      - ${FRANCA_BACKUP_DIR:-/franca-backups-not-set}:/backups
    networks: [internal]

# Secrets are files in the secrets folder on the PC (FRANCA_SECRETS_DIR). The installer writes them (story E01-011).
secrets:
  google_client_secret:
    file: ${FRANCA_SECRETS_DIR:-./secrets}/google_client_secret
  session_secret:
    file: ${FRANCA_SECRETS_DIR:-./secrets}/session_secret
  # The backups' encryption password. Without it the backups cannot be read, so the owner keeps a copy elsewhere.
  backup_password:
    file: ${FRANCA_SECRETS_DIR:-./secrets}/backup_password

volumes:
  updater-status:
  backup-cache:
  backup-status:
  app-data:
  caddy-data:
  caddy-config:

networks:
  internal:
  docker-api:
    internal: true
